[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ceny-paliw"
version = "1.1.0"
description = "Pobiera maksymalne ceny paliw z obwieszczeń Ministra Energii (Monitor Polski) i publikuje je jako JSON dla aplikacji PWA."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gerard Modlewski" }]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "reportlab>=4.0",
    "pillow>=10.0",
]

[project.scripts]
ceny-paliw = "fuelprices.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
